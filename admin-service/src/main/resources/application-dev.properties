# ======================
# = Service Info =
# ======================
spring.application.name=admin-service
server.port=8085

# ======================
# = Database Config =
# ======================
spring.datasource.url=jdbc:mysql://localhost:3311/admin_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ======================
# = Eureka Discovery =
# ======================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# ======================
# = OpenAPI Swagger Docs =
# ======================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ======================
# = Keycloak Security =
# ======================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8181/realms/spring-microservices-realm
spring.security.oauth2.client.registration.keycloak.client-id=admin-service
spring.security.oauth2.client.registration.keycloak.client-secret=gqsmrvr3XyeZBrZ5hP4kQGmpBVXXz9r2
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8181/realms/spring-microservices-realm

# ======================
# = Resilience4j Config =
# ======================
resilience4j.circuitbreaker.instances.default.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.default.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.default.slidingWindowSize=10
resilience4j.circuitbreaker.instances.default.failureRateThreshold=50
resilience4j.circuitbreaker.instances.default.waitDurationInOpenState=5s

resilience4j.retry.instances.default.max-attempts=3
resilience4j.retry.instances.default.wait-duration=2s
