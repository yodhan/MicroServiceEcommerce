server:
    port: 8083
    servlet:
        context-path: /cart

spring:
    application:
        name: cart-service

    datasource:
        url: jdbc:mysql://localhost:3307/cartdb  # Local MySQL port mapped from Docker
        username: root
        password: root
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        database-platform: org.hibernate.dialect.MySQLDialect

    data:
        redis:
            host: localhost
            port: 6379

    cache:
        type: redis
        redis:
            time-to-live: 600000  # 10 minutes

    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: http://localhost:8181/realms/spring-microservices-realm
            client:
                registration:
                    keycloak:
                        client-id: cart-service
                        client-secret: Hef9iEbkYkg9xS2adty7lJr0jN7rE3ap
                provider:
                    keycloak:
                        issuer-uri: http://localhost:8181/realms/spring-microservices-realm

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui.html
        operationsSorter: method

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/
    instance:
        prefer-ip-address: true

management:
    endpoints:
        web:
            exposure:
                include: '*'
    endpoint:
        health:
            show-details: always
