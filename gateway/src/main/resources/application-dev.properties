# ==============================
# = General Configuration =
# ==============================
spring.application.name=gateway
server.port=8084

# ==============================
# = Eureka Discovery =
# ==============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# ==============================
# = OpenAPI Swagger Aggregation =
# ==============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

springdoc.swagger-ui.urls[0].name=Product Service
springdoc.swagger-ui.urls[0].url=/aggregate/product-service/v3/api-docs

springdoc.swagger-ui.urls[1].name=Order Service
springdoc.swagger-ui.urls[1].url=/aggregate/order-service/v3/api-docs

springdoc.swagger-ui.urls[2].name=Inventory Service
springdoc.swagger-ui.urls[2].url=/aggregate/inventory-service/v3/api-docs

springdoc.swagger-ui.urls[3].name=Admin Service
springdoc.swagger-ui.urls[3].url=/aggregate/admin-service/v3/api-docs

# ==============================
# = OAuth2 Keycloak =
# ==============================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8181/realms/spring-microservices-realm

spring.security.oauth2.client.registration.keycloak.client-id=gateway-service
spring.security.oauth2.client.registration.keycloak.client-secret=Xxlft7aoGWWZ5RtRGYEdZHHWnHZ0O3fv
