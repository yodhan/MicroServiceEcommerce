
services:
    mysql_db:
        image: mysql:8.0
        container_name: mysql-inventory-service
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: mydatabase
            MYSQL_USER: test
            MYSQL_PASSWORD: test
        ports:
            - "3307:3307"
        volumes:
            - ./mysql:/var/lib/mysql
            - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
